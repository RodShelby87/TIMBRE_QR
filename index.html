<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Timbre QR</title>
  <style>
    :root{--navy:#0f172a;--sky:#38bdf8;--bg:#f4f7fb;--bg2:#eef2ff;--text:#172033;--muted:#64748b;--line:#dbe3ee;--ok:#15803d;--card:#fff;--input:#fff;--shadow:#33415522}
    html[data-theme="dark"]{--navy:#020617;--sky:#38bdf8;--bg:#07111f;--bg2:#111827;--text:#e5eef8;--muted:#94a3b8;--line:#334155;--card:#111827;--input:#0b1220;--shadow:#0008}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top left,color-mix(in srgb,var(--sky) 18%,var(--bg)),var(--bg) 45%,var(--bg2));min-height:100vh}
    main{width:min(100% - 28px,520px);margin:auto;padding:28px 0}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:25px;box-shadow:0 10px 24px #0f172a28}.eyebrow{margin:0;color:#0369a1;font-size:12px;font-weight:800;letter-spacing:.18em}.brand h1{margin:2px 0 0;font-size:23px}.card{overflow:hidden;border-radius:30px;background:var(--card);box-shadow:0 18px 55px var(--shadow);border:1px solid var(--line)}.hero{padding:30px 24px;text-align:center;background:var(--navy);color:#fff}.bell{width:68px;height:68px;margin:0 auto 15px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--navy);font-size:32px}.hero h2{font-size:25px;margin:0}.hero p{margin:8px 0 0;color:#cbd5e1;font-size:14px}.body{padding:24px}.field{margin-bottom:16px}label{display:block;font-size:14px;font-weight:750;margin-bottom:7px}label span{font-weight:400;color:#94a3b8}input{width:100%;height:50px;border:1px solid var(--line);border-radius:13px;padding:0 14px;font:inherit;outline:none;background:var(--input);color:var(--text)}input:focus{border-color:#38bdf8;box-shadow:0 0 0 4px #38bdf822}button{width:100%;height:56px;border:0;border-radius:16px;background:var(--sky);color:var(--navy);font:inherit;font-weight:850;font-size:16px;cursor:pointer}button:disabled{cursor:default;opacity:.75}.privacy{text-align:center;color:#94a3b8;font-size:12px;margin:14px 0 0}.success{display:none;margin-bottom:16px;padding:13px;border-radius:13px;background:#dcfce7;color:var(--ok);font-size:14px;font-weight:700}.success.show{display:block}.shake{animation:ring .55s ease}@keyframes ring{20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}.theme-toggle{width:auto;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:14px;box-shadow:0 6px 18px var(--shadow)}@media(max-width:480px){.topbar{align-items:flex-start}.theme-toggle{padding:0 11px}.theme-label{display:none}}
  </style>
</head>
<body>
  <main>
    <div class="topbar"><header class="brand"><div class="logo">⌂</div><div><p class="eyebrow">TIMBRE QR</p><h1>Aviso de puerta principal</h1></div></header><button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar modo de color"><span id="themeIcon">🌙</span> <span id="themeLabel" class="theme-label">Modo oscuro</span></button></div>
    <section class="card">
      <div class="hero"><div class="bell" id="bell">🔔</div><h2>¡Hola! ¿Estás en la puerta?</h2><p>Tocá el botón para avisar que estás en la puerta.</p></div>
      <div class="body">
        <div id="success" class="success" role="status">✓ Tu aviso fue enviado.</div>
        <form id="doorbellForm">
          <div class="field"><label for="visitorName">Tu nombre <span>(opcional)</span></label><input id="visitorName" name="name" maxlength="50" autocomplete="name" placeholder="Ej.: Alex" /></div>
          <div class="field"><label for="visitorNote">Mensaje breve <span>(opcional)</span></label><input id="visitorNote" name="message" maxlength="100" placeholder="Delivery, vecino, amigo..." /></div>
          <button id="ringButton" type="submit">🔔 Tocar el timbre</button>
        </form>
        <p class="privacy">No hace falta iniciar sesión. Tocá una sola vez y esperá.</p>
      </div>
    </section>
    <footer>Timbre QR · Versión inicial para GitHub Pages</footer>
  </main>
  <script>
    // PASO 2: Reemplazaremos este valor vacío con el endpoint seguro de notificaciones.
    const NOTIFICATION_ENDPOINT = "";
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeLabel = document.getElementById("themeLabel");
    const savedTheme = localStorage.getItem("timbre-theme");
    const initialTheme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const dark = theme === "dark";
      themeIcon.textContent = dark ? "☀️" : "🌙";
      themeLabel.textContent = dark ? "Modo claro" : "Modo oscuro";
      themeToggle.setAttribute("aria-pressed", String(dark));
    }
    applyTheme(initialTheme);
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("timbre-theme", next);
      applyTheme(next);
    });

    const form = document.getElementById("doorbellForm");
    const button = document.getElementById("ringButton");
    const success = document.getElementById("success");
    const bell = document.getElementById("bell");
    let locked = false;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (locked) return;
      locked = true;
      button.disabled = true;
      button.textContent = "Enviando...";
      bell.classList.remove("shake");
      void bell.offsetWidth;
      bell.classList.add("shake");

      const payload = {
        name: document.getElementById("visitorName").value.trim() || "Alguien",
        message: document.getElementById("visitorNote").value.trim() || "Hay una persona esperando en la puerta.",
        sentAt: new Date().toISOString()
      };

      try {
        if (NOTIFICATION_ENDPOINT) {
          const response = await fetch(NOTIFICATION_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error("Falló la solicitud de notificación");
        } else {
          // Modo de prueba hasta conectar el servicio de notificaciones.
          console.log("Evento de prueba del timbre:", payload);
        }
        success.classList.add("show");
        button.textContent = NOTIFICATION_ENDPOINT ? "✓ Notificación enviada" : "✓ Prueba exitosa";
        form.reset();
      } catch (error) {
        success.textContent = "No se pudo enviar el aviso. Intentá nuevamente.";
        success.style.background = "#fee2e2";
        success.style.color = "#b91c1c";
        success.classList.add("show");
        button.textContent = "Intentar nuevamente";
        locked = false;
        button.disabled = false;
        return;
      }

      setTimeout(() => {
        success.classList.remove("show");
        button.textContent = "🔔 Tocar el timbre";
        button.disabled = false;
        locked = false;
      }, 10000);
    });
  </script>
</body>
</html>
