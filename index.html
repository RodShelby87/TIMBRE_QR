<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Timbre QR</title>
<style>
:root{--bg:#f4f7fb;--bg2:#eef2ff;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ee;--navy:#0f172a;--sky:#38bdf8;--input:#fff;--shadow:#33415522}
html[data-theme="dark"]{--bg:#07111f;--bg2:#111827;--card:#111827;--text:#e5eef8;--muted:#94a3b8;--line:#334155;--navy:#020617;--input:#0b1220;--shadow:#0008}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top left,#14334a,var(--bg) 45%,var(--bg2))}main{width:min(100% - 28px,520px);margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:25px}.eyebrow{margin:0;color:#0284c7;font-size:12px;font-weight:800;letter-spacing:.18em}.brand h1{margin:2px 0 0;font-size:22px}.toggle{width:auto;height:42px;padding:0 13px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-weight:700;cursor:pointer}.card{overflow:hidden;border-radius:30px;background:var(--card);box-shadow:0 18px 55px var(--shadow);border:1px solid var(--line)}.hero{padding:30px 24px;text-align:center;background:var(--navy);color:#fff}.bell{width:68px;height:68px;margin:0 auto 15px;border-radius:50%;display:grid;place-items:center;background:var(--sky);font-size:32px}.hero h2{font-size:25px;margin:0}.hero p{margin:8px 0 0;color:#cbd5e1;font-size:14px}.body{padding:24px}.field{margin-bottom:16px}label{display:block;font-size:14px;font-weight:750;margin-bottom:7px}label span{font-weight:400;color:var(--muted)}input{width:100%;height:50px;border:1px solid var(--line);border-radius:13px;padding:0 14px;font:inherit;outline:none;background:var(--input);color:var(--text)}input:focus{border-color:var(--sky);box-shadow:0 0 0 4px #38bdf822}.ring{width:100%;height:56px;border:0;border-radius:16px;background:var(--sky);color:#0f172a;font:inherit;font-weight:850;font-size:16px;cursor:pointer}.ring:disabled{opacity:.72}.msg{display:none;margin-bottom:16px;padding:13px;border-radius:13px;font-size:14px;font-weight:700}.msg.show{display:block}.ok{background:#dcfce7;color:#15803d}.bad{background:#fee2e2;color:#b91c1c}.privacy,footer{text-align:center;color:var(--muted);font-size:12px}.privacy{margin:14px 0 0}footer{margin-top:18px}.shake{animation:ring .55s ease}@keyframes ring{20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}@media(max-width:480px){.themeText{display:none}.toggle{padding:0 11px}}
</style>
</head>
<body><main>
<div class="top"><header class="brand"><div class="logo">⌂</div><div><p class="eyebrow">TIMBRE QR</p><h1>Aviso de puerta principal</h1></div></header><button id="theme" class="toggle" type="button"><span id="themeIcon">🌙</span> <span id="themeText" class="themeText">Modo oscuro</span></button></div>
<section class="card"><div class="hero"><div class="bell" id="bell">🔔</div><h2>¡Hola! ¿Estás en la puerta?</h2><p>Tocá el botón para avisar que estás en la puerta.</p></div><div class="body">
<div id="status" class="msg" role="status"></div><form id="form"><div class="field"><label for="name">Tu nombre <span>(opcional)</span></label><input id="name" maxlength="50" autocomplete="name" placeholder="Ej.: Alex"></div><div class="field"><label for="note">Mensaje breve <span>(opcional)</span></label><input id="note" maxlength="100" placeholder="Delivery, vecino, amigo..."></div><button id="ring" class="ring" type="submit">🔔 Tocar el timbre</button></form><p class="privacy">No hace falta iniciar sesión. Tocá una sola vez y esperá.</p>
</div></section><footer>Timbre QR</footer></main>
<script>
const ENDPOINT="https://ntfy.sh/timbre-rp-87-f4c29a71-b6e3-4d90";
const COOLDOWN=30000;
const theme=document.getElementById('theme'),themeIcon=document.getElementById('themeIcon'),themeText=document.getElementById('themeText');
function applyTheme(t){document.documentElement.dataset.theme=t;const d=t==='dark';themeIcon.textContent=d?'☀️':'🌙';themeText.textContent=d?'Modo claro':'Modo oscuro'}
applyTheme(localStorage.getItem('timbre-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
theme.onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('timbre-theme',t);applyTheme(t)};
const form=document.getElementById('form'),button=document.getElementById('ring'),status=document.getElementById('status'),bell=document.getElementById('bell');
form.addEventListener('submit',async e=>{e.preventDefault();const last=Number(localStorage.getItem('last-ring')||0);if(Date.now()-last<COOLDOWN){show('El aviso ya fue enviado. Esperá unos segundos antes de volver a tocar.','ok');return}button.disabled=true;button.textContent='Enviando...';bell.classList.remove('shake');void bell.offsetWidth;bell.classList.add('shake');const name=document.getElementById('name').value.trim()||'Alguien';const note=document.getElementById('note').value.trim()||'Hay una persona esperando en la puerta.';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8','Title':'🔔 Alguien está en la puerta','Priority':'high','Tags':'door,bell'},body:`${name}: ${note}`});if(!r.ok)throw new Error();localStorage.setItem('last-ring',Date.now());show('✓ Tu aviso fue enviado.','ok');form.reset();button.textContent='✓ Notificación enviada';setTimeout(reset,10000)}catch{show('No se pudo enviar el aviso. Intentá nuevamente.','bad');reset()}});
function show(text,type){status.textContent=text;status.className=`msg show ${type}`}
function reset(){button.disabled=false;button.textContent='🔔 Tocar el timbre'}
</script></body></html>
